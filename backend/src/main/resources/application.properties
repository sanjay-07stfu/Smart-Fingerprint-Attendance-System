spring.application.name=backend

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/smart_fingerprint_attendance
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Port
server.port=8080

# New security/device secrets must be supplied by the runtime environment.
app.jwt.secret=${SFA_JWT_SECRET:}
app.jwt.expiration-ms=${SFA_JWT_EXPIRATION_MS:86400000}
app.device.api-key=${SFA_DEVICE_API_KEY:}
